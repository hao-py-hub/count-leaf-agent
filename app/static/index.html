<!DOCTYPE html>

<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>油菜考种工作台</title>
    <style>
        :root {
            --bg: #f4f6f3;
            --surface: #ffffff;
            --surface-muted: #f8faf8;
            --line: #dce3dc;
            --line-strong: #c8d2c9;
            --text: #18221b;
            --text-muted: #647067;
            --green: #257347;
            --green-dark: #195535;
            --green-soft: #e8f3ec;
            --amber: #a86712;
            --amber-soft: #fff4dc;
            --red: #b63737;
            --red-soft: #fbeaea;
            --blue: #286493;
            --blue-soft: #eaf2f8;
            --header-height: 62px;
            --sidebar-width: 300px;
            font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif;
            color: var(--text);
            background: var(--bg);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-width: 320px;
            min-height: 100vh;
            background: var(--bg);
        }

        button, input, select { font: inherit; }
        button { cursor: pointer; }
        button:disabled { cursor: not-allowed; opacity: 0.5; }
        .hidden { display: none !important; }

        .app-header {
            position: fixed;
            inset: 0 0 auto 0;
            z-index: 30;
            height: var(--header-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 22px;
            color: #ffffff;
            background: #1b2820;
            border-bottom: 1px solid #314036;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            min-width: 0;
        }

        .brand-mark {
            width: 32px;
            height: 32px;
            display: grid;
            place-items: center;
            flex: 0 0 auto;
            border-radius: 6px;
            color: #173923;
            background: #92d3a7;
            font-weight: 800;
        }

        .brand-title {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .service-state {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #cbd6ce;
            font-size: 12px;
        }

        .service-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #e3a849;
        }

        .service-dot.online { background: #67c587; }
        .service-dot.offline { background: #e66c6c; }

        .app-shell {
            display: grid;
            grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
            min-height: 100vh;
            padding-top: var(--header-height);
        }

        .history-pane {
            position: fixed;
            top: var(--header-height);
            bottom: 0;
            left: 0;
            width: var(--sidebar-width);
            display: flex;
            flex-direction: column;
            min-height: 0;
            background: var(--surface);
            border-right: 1px solid var(--line);
        }

        .history-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 58px;
            padding: 0 16px;
            border-bottom: 1px solid var(--line);
        }

        .history-title {
            display: flex;
            align-items: baseline;
            gap: 8px;
            font-size: 14px;
            font-weight: 700;
        }

        .history-count {
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 500;
        }

        .icon-button {
            width: 32px;
            height: 32px;
            display: inline-grid;
            place-items: center;
            padding: 0;
            color: var(--text-muted);
            background: transparent;
            border: 1px solid transparent;
            border-radius: 5px;
            font-size: 19px;
            line-height: 1;
        }

        .icon-button:hover { color: var(--text); background: var(--surface-muted); border-color: var(--line); }
        .icon-button.danger:hover { color: var(--red); background: var(--red-soft); }

        .assistant-dialog {
            width: min(720px, calc(100vw - 32px));
            max-height: min(760px, calc(100vh - 32px));
            padding: 0;
            color: var(--text);
            background: var(--surface);
            border: 1px solid var(--line-strong);
            border-radius: 7px;
            box-shadow: 0 18px 48px rgba(20, 33, 24, 0.22);
        }

        .assistant-dialog::backdrop { background: rgba(20, 31, 23, 0.36); }
        .assistant-shell { display: flex; flex-direction: column; min-height: 520px; max-height: inherit; }
        .assistant-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 15px 18px; border-bottom: 1px solid var(--line); }
        .assistant-title { margin: 0; font-size: 16px; }
        .assistant-subtitle { margin-top: 3px; color: var(--text-muted); font-size: 12px; }
        .assistant-messages { flex: 1; min-height: 260px; overflow-y: auto; padding: 18px; background: var(--surface-muted); }
        .assistant-message { max-width: 88%; padding: 10px 12px; margin-bottom: 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); font-size: 13px; line-height: 1.65; white-space: pre-wrap; }
        .assistant-message.user { margin-left: auto; color: #173923; background: var(--green-soft); border-color: #b7d7c1; }
        .assistant-evidence { display: grid; gap: 4px; margin-top: 8px; color: var(--text-muted); font-size: 11px; }
        .assistant-meta { margin-top: 7px; color: var(--text-muted); font-size: 11px; }
        .assistant-form { display: flex; gap: 10px; padding: 14px 18px; border-top: 1px solid var(--line); }
        .assistant-input { min-width: 0; flex: 1; min-height: 42px; resize: vertical; padding: 9px 11px; color: var(--text); border: 1px solid var(--line-strong); border-radius: 5px; outline: none; }
        .assistant-input:focus { border-color: var(--green); box-shadow: 0 0 0 2px rgba(37, 115, 71, 0.12); }
        .task-dialog { width: min(760px, calc(100vw - 32px)); padding: 0; color: var(--text); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 7px; box-shadow: 0 18px 48px rgba(20, 33, 24, 0.22); }
        .task-dialog::backdrop { background: rgba(20, 31, 23, 0.36); }
        .task-list { min-height: 260px; max-height: min(560px, calc(100vh - 180px)); overflow: auto; padding: 16px 18px; }
        .task-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .task-table th { padding: 0 8px 9px; color: var(--text-muted); font-weight: 600; text-align: left; border-bottom: 1px solid var(--line); }
        .task-table td { padding: 10px 8px; vertical-align: top; border-bottom: 1px solid var(--line); }
        .task-id { max-width: 185px; overflow: hidden; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; text-overflow: ellipsis; white-space: nowrap; }
        .task-result { margin: 0 18px 16px; padding: 12px; color: var(--text); background: var(--surface-muted); border: 1px solid var(--line); border-radius: 5px; font-size: 12px; line-height: 1.6; }

        .history-search-wrap {
            padding: 12px 14px;
            border-bottom: 1px solid var(--line);
        }

        .history-search {
            width: 100%;
            height: 36px;
            padding: 0 11px;
            color: var(--text);
            background: var(--surface-muted);
            border: 1px solid var(--line);
            border-radius: 5px;
            outline: none;
        }

        .history-search:focus { border-color: var(--green); box-shadow: 0 0 0 2px rgba(37, 115, 71, 0.12); }

        .history-list {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 8px;
        }

        .history-empty {
            padding: 42px 16px;
            color: var(--text-muted);
            text-align: center;
            font-size: 13px;
        }

        .history-item {
            width: 100%;
            display: grid;
            grid-template-columns: 54px minmax(0, 1fr);
            gap: 10px;
            padding: 9px;
            margin-bottom: 6px;
            color: inherit;
            text-align: left;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 6px;
        }

        .history-item:hover { background: var(--surface-muted); border-color: var(--line); }
        .history-item.active { background: var(--green-soft); border-color: #b7d7c1; }

        .history-thumb {
            width: 54px;
            height: 48px;
            object-fit: cover;
            background: #e7ebe8;
            border: 1px solid var(--line);
            border-radius: 4px;
        }

        .history-info { min-width: 0; }

        .history-name {
            margin: 1px 0 5px;
            overflow: hidden;
            font-size: 13px;
            font-weight: 650;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .history-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            color: var(--text-muted);
            font-size: 11px;
        }

        .history-total { color: var(--green-dark); font-weight: 700; }

        .status-chip {
            display: inline-flex;
            align-items: center;
            min-height: 22px;
            padding: 2px 7px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 650;
        }

        .status-chip.completed { color: var(--green-dark); background: var(--green-soft); }
        .status-chip.processing { color: var(--amber); background: var(--amber-soft); }
        .status-chip.failed { color: var(--red); background: var(--red-soft); }
        .status-chip.modified { color: var(--blue); background: var(--blue-soft); }

        .workspace {
            grid-column: 2;
            min-width: 0;
            min-height: calc(100vh - var(--header-height));
        }

        .action-bar {
            position: sticky;
            top: var(--header-height);
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            min-height: 66px;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.97);
            border-bottom: 1px solid var(--line);
        }

        .action-group {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .button {
            min-height: 38px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 7px 13px;
            color: var(--text);
            background: var(--surface);
            border: 1px solid var(--line-strong);
            border-radius: 5px;
            font-size: 13px;
            font-weight: 650;
        }

        .button:hover { background: var(--surface-muted); border-color: #aebbb0; }
        .button.primary { color: #ffffff; background: var(--green); border-color: var(--green); }
        .button.primary:hover { background: var(--green-dark); border-color: var(--green-dark); }
        .button.danger { color: var(--red); border-color: #e1b8b8; }
        .button.compact { min-height: 32px; padding: 5px 9px; font-size: 12px; }

        .button-symbol {
            display: inline-grid;
            place-items: center;
            width: 17px;
            height: 17px;
            font-size: 16px;
            line-height: 1;
        }

        .queue-summary {
            display: flex;
            align-items: center;
            gap: 9px;
            color: var(--text-muted);
            font-size: 12px;
        }

        .queue-count {
            min-width: 24px;
            height: 24px;
            display: inline-grid;
            place-items: center;
            padding: 0 6px;
            color: #ffffff;
            background: var(--green);
            border-radius: 12px;
            font-weight: 700;
        }

        .content {
            width: min(1440px, 100%);
            margin: 0 auto;
            padding: 24px;
        }

        .empty-state {
            min-height: calc(100vh - var(--header-height) - 114px);
            display: grid;
            place-items: center;
            padding: 40px 20px;
            text-align: center;
        }

        .empty-state-inner { max-width: 360px; }

        .empty-symbol {
            width: 72px;
            height: 72px;
            display: grid;
            place-items: center;
            margin: 0 auto 18px;
            color: var(--green-dark);
            background: var(--green-soft);
            border: 1px solid #bfdbc7;
            border-radius: 8px;
            font-size: 30px;
        }

        .empty-title { margin: 0 0 8px; font-size: 19px; }
        .empty-copy { margin: 0; color: var(--text-muted); font-size: 13px; line-height: 1.6; }

        .queue-panel {
            margin-bottom: 20px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 6px;
            overflow: hidden;
        }

        .section-head {
            min-height: 54px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 16px;
            border-bottom: 1px solid var(--line);
        }

        .section-title {
            margin: 0;
            font-size: 14px;
            font-weight: 750;
        }

        .section-subtitle { margin-top: 3px; color: var(--text-muted); font-size: 11px; }

        .queue-table-wrap { max-height: 360px; overflow: auto; }
        .component-table-wrap { overflow-x: auto; }
        .queue-table-wrap th { position: sticky; top: 0; z-index: 1; }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th {
            height: 38px;
            padding: 8px 12px;
            color: var(--text-muted);
            text-align: left;
            background: var(--surface-muted);
            border-bottom: 1px solid var(--line);
            font-size: 11px;
            font-weight: 700;
        }

        td {
            min-height: 44px;
            padding: 9px 12px;
            border-bottom: 1px solid #edf0ed;
            vertical-align: middle;
        }

        tr:last-child td { border-bottom: 0; }
        .file-path { max-width: 520px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

        .record-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 18px;
            margin-bottom: 18px;
        }

        .record-title {
            margin: 0 0 7px;
            font-size: 21px;
            line-height: 1.3;
            overflow-wrap: anywhere;
        }

        .record-meta {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px 14px;
            color: var(--text-muted);
            font-size: 12px;
        }

        .analysis-state {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 150px;
            justify-content: flex-end;
            color: var(--text-muted);
            font-size: 12px;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid #cbd7ce;
            border-top-color: var(--green);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .summary-band {
            display: grid;
            grid-template-columns: repeat(6, minmax(110px, 1fr));
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 6px;
            overflow: hidden;
        }

        .metric {
            min-width: 0;
            padding: 15px 16px;
            border-right: 1px solid var(--line);
        }

        .metric:last-child { border-right: 0; }
        .metric-label { margin-bottom: 7px; color: var(--text-muted); font-size: 11px; }
        .metric-value { font-size: 22px; line-height: 1.1; font-weight: 760; overflow-wrap: anywhere; }
        .metric-unit { margin-left: 3px; color: var(--text-muted); font-size: 11px; font-weight: 500; }

        .editor-section, .steps-section {
            margin-top: 18px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 6px;
            overflow: hidden;
        }

        .editor-toolbar {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .field-inline {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .field-inline label { color: var(--text-muted); font-size: 12px; font-weight: 650; }

        .input, .select {
            height: 34px;
            padding: 5px 9px;
            color: var(--text);
            background: #ffffff;
            border: 1px solid var(--line-strong);
            border-radius: 4px;
            outline: none;
        }

        .input:focus, .select:focus { border-color: var(--green); box-shadow: 0 0 0 2px rgba(37, 115, 71, 0.12); }
        .count-input { width: 92px; text-align: right; }
        .plant-count-input { width: 74px; text-align: right; }
        .component-table { min-width: 680px; }
        .component-table th:last-child, .component-table td:last-child { width: 54px; text-align: center; }
        .component-id { color: var(--text-muted); font-variant-numeric: tabular-nums; }
        .original-count { color: var(--text-muted); }
        .manual-flag { color: var(--blue); font-size: 11px; }

        .editor-footer {
            min-height: 58px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 16px;
            background: var(--surface-muted);
            border-top: 1px solid var(--line);
        }

        .dirty-state { color: var(--amber); font-size: 12px; }
        .saved-state { color: var(--green); font-size: 12px; }

        .steps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 12px;
            padding: 14px;
        }

        .step-item {
            min-width: 0;
            overflow: hidden;
            background: var(--surface-muted);
            border: 1px solid var(--line);
            border-radius: 5px;
        }

        .step-image {
            width: 100%;
            aspect-ratio: 16 / 10;
            display: block;
            object-fit: contain;
            background: #202622;
            cursor: zoom-in;
        }

        .step-desc {
            min-height: 58px;
            padding: 9px 10px;
            color: #455049;
            font-size: 11px;
            line-height: 1.45;
        }

        .step-number { color: var(--green); font-weight: 750; }

        .error-panel {
            padding: 16px;
            color: var(--red);
            background: var(--red-soft);
            border: 1px solid #e9bcbc;
            border-radius: 6px;
        }

        dialog {
            padding: 0;
            color: var(--text);
            background: var(--surface);
            border: 1px solid var(--line-strong);
            border-radius: 7px;
            box-shadow: 0 20px 60px rgba(24, 34, 27, 0.24);
        }

        dialog::backdrop { background: rgba(19, 27, 22, 0.56); }

        .library-dialog {
            width: min(980px, calc(100vw - 32px));
            height: min(720px, calc(100vh - 32px));
        }

        .dialog-shell { height: 100%; display: flex; flex-direction: column; min-height: 0; }

        .dialog-head {
            min-height: 58px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            border-bottom: 1px solid var(--line);
        }

        .dialog-title { margin: 0; font-size: 15px; }

        .library-tools { padding: 12px 14px; border-bottom: 1px solid var(--line); }
        .library-list { flex: 1; min-height: 0; overflow: auto; padding: 12px; }

        .library-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 10px;
        }

        .library-item {
            min-width: 0;
            padding: 0;
            text-align: left;
            color: inherit;
            background: #ffffff;
            border: 1px solid var(--line);
            border-radius: 5px;
            overflow: hidden;
        }

        .library-item:hover { border-color: var(--green); }
        .library-item img { width: 100%; aspect-ratio: 4 / 3; display: block; object-fit: cover; background: #e7ebe8; }
        .library-item-name { padding: 8px 9px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 12px; }

        .lightbox-dialog {
            max-width: calc(100vw - 36px);
            max-height: calc(100vh - 36px);
            background: #111713;
            border-color: #3c4940;
        }

        .lightbox-dialog img { display: block; max-width: calc(100vw - 56px); max-height: calc(100vh - 90px); object-fit: contain; }

        .lightbox-close {
            position: absolute;
            top: 8px;
            right: 8px;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.24);
        }

        .toast-stack {
            position: fixed;
            right: 18px;
            bottom: 18px;
            z-index: 100;
            display: grid;
            gap: 8px;
            width: min(360px, calc(100vw - 36px));
        }

        .toast {
            padding: 11px 13px;
            color: #ffffff;
            background: #243128;
            border: 1px solid #415047;
            border-radius: 5px;
            box-shadow: 0 10px 30px rgba(20, 30, 23, 0.2);
            font-size: 12px;
            line-height: 1.45;
        }

        .toast.error { background: #6f2525; border-color: #9b4545; }

        @media (max-width: 1120px) {
            :root { --sidebar-width: 270px; }
            .summary-band { grid-template-columns: repeat(3, minmax(120px, 1fr)); }
            .metric:nth-child(3) { border-right: 0; }
            .metric:nth-child(-n+3) { border-bottom: 1px solid var(--line); }
        }

        @media (max-width: 780px) {
            .app-header { position: static; height: 56px; padding: 0 14px; }
            .service-state span:last-child { display: none; }
            .app-shell { display: block; padding-top: 0; }
            .history-pane {
                position: static;
                width: 100%;
                height: auto;
                max-height: 230px;
                border-right: 0;
                border-bottom: 1px solid var(--line);
            }
            .history-head { height: 48px; }
            .history-search-wrap { padding: 8px 12px; }
            .history-list { display: flex; gap: 7px; overflow-x: auto; padding: 8px 10px; }
            .history-item { flex: 0 0 235px; margin: 0; }
            .history-empty { width: 100%; padding: 20px; }
            .workspace { min-height: 0; }
            .action-bar { position: static; align-items: flex-start; padding: 10px 12px; }
            .action-group { gap: 6px; }
            .button { min-height: 36px; padding: 6px 10px; }
            .queue-summary { align-self: center; }
            .content { padding: 14px 12px 28px; }
            .record-head { display: block; }
            .analysis-state { justify-content: flex-start; margin-top: 10px; }
            .summary-band { grid-template-columns: repeat(2, minmax(110px, 1fr)); }
            .metric, .metric:nth-child(3) { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
            .metric:nth-child(2n) { border-right: 0; }
            .metric:nth-last-child(-n+2) { border-bottom: 0; }
            .section-head { align-items: flex-start; flex-direction: column; }
            .editor-toolbar { width: 100%; }
            .editor-footer { align-items: flex-start; flex-direction: column; }
            .editor-footer .action-group { width: 100%; }
            .editor-footer .button { flex: 1; }
            .steps-grid { grid-template-columns: 1fr; }
        }

        @media (max-width: 430px) {
            .brand-title { font-size: 14px; }
            .action-bar { display: block; }
            .queue-summary { margin-top: 9px; }
            .summary-band { grid-template-columns: 1fr 1fr; }
            .metric { padding: 12px; }
            .metric-value { font-size: 19px; }
            .field-inline { width: 100%; justify-content: space-between; }
            .plant-count-input { width: 92px; }
        }
    </style>
</head>
<body>
    <header class="app-header">
        <div class="brand">
            <div class="brand-mark">油</div>
            <div class="brand-title">油菜考种工作台</div>
        </div>
        <div class="service-state">
            <button class="icon-button" id="openAssistantBtn" type="button" title="打开研究助手" aria-label="打开研究助手">◈</button>
            <button class="icon-button" id="openTaskCenterBtn" type="button" title="打开任务中心" aria-label="打开任务中心">☷</button>
            <span class="service-dot" id="serviceDot"></span>
            <span id="serviceLabel">连接中</span>
        </div>
    </header>

    <div class="app-shell">
        <aside class="history-pane">
            <div class="history-head">
                <div class="history-title">识别历史 <span class="history-count" id="historyCount">0</span></div>
                <button class="icon-button" id="refreshHistoryBtn" type="button" title="刷新历史" aria-label="刷新历史">↻</button>
            </div>
            <div class="history-search-wrap">
                <input class="history-search" id="historySearch" type="search" placeholder="搜索文件名" autocomplete="off">
            </div>
            <div class="history-list" id="historyList"></div>
        </aside>

        <main class="workspace">
            <div class="action-bar">
                <div class="action-group">
                    <button class="button primary" id="selectFileBtn" type="button"><span class="button-symbol">＋</span>选择图片</button>
                    <button class="button" id="selectFolderBtn" type="button"><span class="button-symbol">▣</span>选择文件夹</button>
                    <button class="button" id="openLibraryBtn" type="button"><span class="button-symbol">▦</span>数据目录</button>
                    <input class="hidden" id="fileInput" type="file" accept="image/jpeg,image/png,image/bmp,image/tiff">
                    <input class="hidden" id="folderInput" type="file" accept="image/jpeg,image/png,image/bmp,image/tiff" webkitdirectory directory multiple>
                </div>
                <div class="queue-summary">
                    <span>待处理</span>
                    <span class="queue-count" id="queueCount">0</span>
                </div>
            </div>

            <div class="content">
                <section class="queue-panel hidden" id="queuePanel">
                    <div class="section-head">
                        <div>
                            <h2 class="section-title">识别队列</h2>
                            <div class="section-subtitle" id="queueSubtitle">0 张图片</div>
                        </div>
                        <div class="action-group">
                            <button class="button compact" id="clearQueueBtn" type="button">清空</button>
                            <button class="button compact danger hidden" id="stopQueueBtn" type="button">停止</button>
                            <button class="button compact primary" id="startQueueBtn" type="button">开始识别</button>
                            <button class="button compact hidden" id="exportFolderSummaryBtn" type="button">导出文件夹汇总 Excel</button>
                        </div>
                    </div>
                    <div class="queue-table-wrap">
                        <table>
                            <thead><tr><th>文件</th><th>大小</th><th>状态</th></tr></thead>
                            <tbody id="queueBody"></tbody>
                        </table>
                    </div>
                </section>

                <section class="empty-state" id="emptyState">
                    <div class="empty-state-inner">
                        <div class="empty-symbol">＋</div>
                        <h1 class="empty-title">选择图片开始识别</h1>
                        <p class="empty-copy">历史结果会保存在本机，文件夹图片进入队列后再统一开始。</p>
                    </div>
                </section>

                <section class="hidden" id="recordView">
                    <div class="record-head">
                        <div>
                            <h1 class="record-title" id="recordTitle">识别结果</h1>
                            <div class="record-meta" id="recordMeta"></div>
                        </div>
                        <div class="analysis-state" id="analysisState"></div>
                    </div>

                    <div class="error-panel hidden" id="errorPanel"></div>

                    <div id="resultContent">
                        <section class="summary-band" id="summaryBand"></section>

                        <section class="editor-section">
                            <div class="section-head">
                                <div>
                                    <h2 class="section-title">结果数据</h2>
                                    <div class="section-subtitle" id="editorSubtitle">未修改</div>
                                </div>
                                <div class="editor-toolbar">
                                    <div class="field-inline">
                                        <label for="plantCountInput">植株数量</label>
                                        <input class="input plant-count-input" id="plantCountInput" type="number" min="0" max="100000" step="1">
                                    </div>
                                    <select class="select" id="newComponentType" aria-label="新增部件类型">
                                        <option value="分枝">分枝</option>
                                        <option value="主枝">主枝</option>
                                        <option value="主干">主干</option>
                                    </select>
                                    <button class="button compact" id="addComponentBtn" type="button"><span class="button-symbol">＋</span>新增部件</button>
                                </div>
                            </div>
                            <div class="component-table-wrap">
                                <table class="component-table">
                                    <thead>
                                        <tr><th>编号</th><th>类型</th><th>角果数量</th><th>VLM 前</th><th>来源</th><th>操作</th></tr>
                                    </thead>
                                    <tbody id="componentBody"></tbody>
                                </table>
                            </div>
                            <div class="editor-footer">
                                <div id="saveState" class="saved-state">数据已保存</div>
                                <div class="action-group">
                                    <button class="button" id="restoreResultBtn" type="button">恢复识别结果</button>
                                    <button class="button primary" id="saveResultBtn" type="button" disabled>保存修改</button>
                                </div>
                            </div>
                        </section>

                        <section class="steps-section">
                            <div class="section-head">
                                <div>
                                    <h2 class="section-title">识别过程</h2>
                                    <div class="section-subtitle" id="stepsSubtitle">0 个步骤</div>
                                </div>
                                <button class="button compact hidden" id="toggleStepsBtn" type="button">显示全部</button>
                            </div>
                            <div class="steps-grid" id="stepsGrid"></div>
                        </section>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <dialog class="library-dialog" id="libraryDialog">
        <div class="dialog-shell">
            <div class="dialog-head">
                <h2 class="dialog-title">数据目录</h2>
                <button class="icon-button" id="closeLibraryBtn" type="button" title="关闭" aria-label="关闭">×</button>
            </div>
            <div class="library-tools">
                <input class="history-search" id="librarySearch" type="search" placeholder="搜索图片" autocomplete="off">
            </div>
            <div class="library-list" id="libraryList"></div>
        </div>
    </dialog>

    <dialog class="lightbox-dialog" id="lightboxDialog">
        <button class="icon-button lightbox-close" id="closeLightboxBtn" type="button" title="关闭" aria-label="关闭">×</button>
        <img id="lightboxImage" alt="识别步骤大图">
    </dialog>

    <dialog class="assistant-dialog" id="assistantDialog">
        <div class="assistant-shell">
            <div class="assistant-head">
                <div>
                    <h2 class="assistant-title">研究助手</h2>
                    <div class="assistant-subtitle">知识、历史统计和已授权分析任务的受控入口</div>
                </div>
                <div class="action-group">
                    <button class="button compact" id="assistantToolCallsBtn" type="button">本次工具链</button>
                    <button class="icon-button" id="closeAssistantBtn" type="button" title="关闭" aria-label="关闭">×</button>
                </div>
            </div>
            <div class="assistant-messages" id="assistantMessages" aria-live="polite">
                <div class="assistant-message">可以询问拍摄规范、知识库内容或历史统计。图片分析仍以现有上传流程和 CV 结果为准。</div>
            </div>
            <form class="assistant-form" id="assistantForm">
                <input class="history-search" id="assistantProjectId" value="default" maxlength="128" placeholder="项目 ID" aria-label="项目 ID">
                <textarea class="assistant-input" id="assistantInput" rows="2" maxlength="2000" placeholder="例如：黑色背景拍摄有哪些要求？"></textarea>
                <input class="hidden" id="assistantFileInput" type="file" accept="image/jpeg,image/png,image/bmp,image/tiff">
                <input class="hidden" id="assistantBatchFileInput" type="file" accept="image/jpeg,image/png,image/bmp,image/tiff" multiple>
                <button class="button" id="assistantAnalyzeBtn" type="button">分析图片</button>
                <button class="button" id="assistantBatchBtn" type="button">批量分析</button>
                <button class="button primary" id="assistantSendBtn" type="submit">发送</button>
            </form>
        </div>
    </dialog>

    <dialog class="task-dialog" id="taskCenterDialog">
        <div class="assistant-shell">
            <div class="assistant-head">
                <div>
                    <h2 class="assistant-title">任务中心</h2>
                    <div class="assistant-subtitle">仅显示最近任务的状态元数据，不显示图片或分析明细</div>
                </div>
                <div class="action-group">
                    <input class="hidden" id="knowledgeFileInput" type="file" accept="text/plain,text/markdown,.txt,.md">
                    <button class="button compact" id="uploadKnowledgeBtn" type="button">导入知识</button>
                    <button class="button compact" id="searchKnowledgeBtn" type="button">检索知识</button>
                    <button class="button compact" id="runtimeStatusBtn" type="button">运行状态</button>
                    <button class="button compact" id="operationsMetricsBtn" type="button">运营指标</button>
                    <button class="button compact" id="domainEventsBtn" type="button">事件对账</button>
                    <button class="button compact" id="domainSamplesBtn" type="button">领域样本</button>
                    <button class="button compact" id="openBatchCenterBtn" type="button">批次任务</button>
                    <button class="button compact" id="qualityReportBtn" type="button">质量评测</button>
                    <button class="button compact" id="openAuditBtn" type="button">审计记录</button>
                    <button class="button compact" id="openReviewQueueBtn" type="button">复核队列</button>
                    <button class="icon-button" id="refreshTaskCenterBtn" type="button" title="刷新任务" aria-label="刷新任务">↻</button>
                    <button class="icon-button" id="closeTaskCenterBtn" type="button" title="关闭" aria-label="关闭">×</button>
                </div>
            </div>
            <div class="task-list" id="taskCenterList"></div>
            <div class="task-result hidden" id="taskResultPanel"></div>
        </div>
    </dialog>

    <div class="toast-stack" id="toastStack" aria-live="polite"></div>

    <script>
        const IMAGE_EXTENSIONS = ['.jpg', '.jpeg', '.png', '.bmp', '.tiff'];
        const state = {
            history: [],
            activeRunId: null,
            activeRecord: null,
            draftPlants: [],
            draftPlantCount: 0,
            dirty: false,
            steps: [],
            showAllSteps: false,
            queue: [],
            queueRunning: false,
            folderRunIds: [],
            folderQueueIds: [],
            stopRequested: false,
            activeController: null,
            libraryItems: [],
            taskCenterTimer: null,
            batchPollers: new Map(),
            assistantConversationId: null,
            jobEventSources: new Map(),
            pendingReview: null,
        };

        const $ = id => document.getElementById(id);

        function escapeHtml(value) {
            return String(value ?? '')
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        function formatBytes(bytes) {
            if (!Number.isFinite(Number(bytes))) return '—';
            const value = Number(bytes);
            if (value < 1024 * 1024) return `${Math.max(1, Math.round(value / 1024))} KB`;
            return `${(value / 1024 / 1024).toFixed(1)} MB`;
        }

        function formatDate(value) {
            if (!value) return '—';
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return String(value);
            return date.toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
        }

        function noCacheUrl(url, key = '') {
            if (!url) return '';
            const separator = url.includes('?') ? '&' : '?';
            return `${url}${separator}v=${encodeURIComponent(key || Date.now())}`;
        }

        async function api(url, options = {}) {
            const response = await fetch(url, options);
            if (!response.ok) {
                let message = `${response.status} ${response.statusText}`;
                try {
                    const payload = await response.json();
                    message = payload.detail || payload.message || message;
                } catch (_) {}
                throw new Error(message);
            }
            return response;
        }

        function toast(message, type = 'info') {
            const element = document.createElement('div');
            element.className = `toast${type === 'error' ? ' error' : ''}`;
            element.textContent = message;
            $('toastStack').appendChild(element);
            setTimeout(() => element.remove(), 4200);
        }

        async function checkHealth() {
            try {
                await api('/api/health');
                $('serviceDot').className = 'service-dot online';
                $('serviceLabel').textContent = '本机服务正常';
            } catch (_) {
                $('serviceDot').className = 'service-dot offline';
                $('serviceLabel').textContent = '服务离线';
            }
        }

        async function loadHistory(query = $('historySearch').value.trim()) {
            try {
                const response = await api(`/api/history?limit=200&q=${encodeURIComponent(query)}`);
                const payload = await response.json();
                state.history = payload.items || [];
                $('historyCount').textContent = payload.count ?? state.history.length;
                renderHistory();
            } catch (error) {
                $('historyList').innerHTML = `<div class="history-empty">${escapeHtml(error.message)}</div>`;
            }
        }

        function renderHistory() {
            const list = $('historyList');
            if (!state.history.length) {
                list.innerHTML = '<div class="history-empty">暂无识别记录</div>';
                return;
            }
            list.innerHTML = state.history.map(item => {
                const statusLabel = item.status === 'completed' ? '已完成' : item.status === 'processing' ? '识别中' : '失败';
                const total = item.total_pods == null ? statusLabel : `${item.total_pods} 个`;
                return `
                    <button class="history-item${state.activeRunId === item.run_id ? ' active' : ''}" type="button" data-run-id="${escapeHtml(item.run_id)}">
                        <img class="history-thumb" src="${escapeHtml(noCacheUrl(item.thumbnail_url, item.updated_at))}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
                        <span class="history-info">
                            <span class="history-name">${escapeHtml(item.source_label)}</span>
                            <span class="history-meta">
                                <span>${escapeHtml(formatDate(item.created_at))}${item.is_modified ? ' · 已修改' : ''}</span>
                                <span class="history-total">${escapeHtml(total)}</span>
                            </span>
                        </span>
                    </button>`;
            }).join('');
            list.querySelectorAll('[data-run-id]').forEach(button => {
                button.addEventListener('click', () => openHistory(button.dataset.runId));
            });
        }

        async function openHistory(runId) {
            if (state.dirty && !confirm('当前修改尚未保存，确定离开吗？')) return;
            try {
                const response = await api(`/api/history/${encodeURIComponent(runId)}`);
                const record = await response.json();
                if (state.pendingReview?.runId !== runId) state.pendingReview = null;
                state.activeRunId = runId;
                state.activeRecord = record;
                state.steps = record.steps || [];
                state.showAllSteps = false;
                state.dirty = false;
                renderHistory();
                renderRecord(record);
            } catch (error) {
                toast(`读取历史失败：${error.message}`, 'error');
            }
        }

        function showRecordShell(title, status = 'processing') {
            $('emptyState').classList.add('hidden');
            $('recordView').classList.remove('hidden');
            $('recordTitle').textContent = title;
            $('errorPanel').classList.add('hidden');
            $('resultContent').classList.remove('hidden');
            $('summaryBand').classList.toggle('hidden', status !== 'completed');
            document.querySelector('.editor-section').classList.toggle('hidden', status !== 'completed');
            if (status === 'processing') {
                $('analysisState').innerHTML = '<span class="spinner"></span><span>正在识别</span>';
            }
        }

        function renderRecord(record) {
            $('emptyState').classList.add('hidden');
            $('recordView').classList.remove('hidden');
            $('recordTitle').textContent = record.source_label || '识别结果';
            const chips = [
                `<span>${escapeHtml(formatDate(record.created_at))}</span>`,
                `<span>${escapeHtml(record.run_id)}</span>`,
            ];
            if (record.result?.sample_id) chips.unshift(`<span>样本 ${escapeHtml(record.result.sample_id)}</span>`);
            const provenance = record.result?.provenance;
            if (provenance) {
                chips.push(`<span>算法 ${escapeHtml(provenance.algorithm || '-')} ${escapeHtml(provenance.algorithm_version || '')}</span>`);
                chips.push(`<span>模型 ${escapeHtml(provenance.vlm_model || '-')}</span>`);
            }
            if (record.is_modified) chips.push('<span class="status-chip modified">已人工修改</span>');
            $('recordMeta').innerHTML = chips.join('');

            const statusLabel = record.status === 'completed' ? '已完成' : record.status === 'processing' ? '识别中' : '失败';
            $('analysisState').innerHTML = record.status === 'processing'
                ? '<span class="spinner"></span><span>正在识别</span>'
                : `<span class="status-chip ${escapeHtml(record.status)}">${statusLabel}</span>`;

            if (record.status === 'failed') {
                $('errorPanel').textContent = record.error_message || '识别失败';
                $('errorPanel').classList.remove('hidden');
                $('resultContent').classList.add('hidden');
                return;
            }

            if (!record.result) {
                $('resultContent').classList.add('hidden');
                return;
            }
            $('resultContent').classList.remove('hidden');
            $('summaryBand').classList.remove('hidden');
            document.querySelector('.editor-section').classList.remove('hidden');
            state.draftPlants = structuredClone(record.result.plants || []);
            state.draftPlantCount = Number(record.result.plant_count ?? state.draftPlants.length);
            state.dirty = false;
            $('plantCountInput').value = state.draftPlantCount;
            renderDraft();
            renderSteps();
            updateSaveState();
            if (record.status === 'completed') {
                const exportBar = document.createElement('div');
                exportBar.className = 'record-actions';
                exportBar.innerHTML = '<button class="button compact" type="button" id="downloadRecordReportBtn">下载报告</button> <button class="button compact" type="button" id="exportRecordExcelBtn">导出 Excel</button>';
                $('summaryBand').appendChild(exportBar);
                $('downloadRecordReportBtn').onclick = () => downloadTaskReport(JSON.stringify(record.result, null, 2), record.run_id, record.result.provenance);
                $('exportRecordExcelBtn').onclick = () => window.location.assign(`/api/history/${encodeURIComponent(record.run_id)}/export.xlsx`);
            }
        }

        function calculateDraftSummary() {
            const sum = label => state.draftPlants
                .filter(plant => plant.label === label)
                .reduce((total, plant) => total + Math.max(0, Number(plant.pod_count) || 0), 0);
            const trunk = sum('主干');
            const main = sum('主枝');
            const branches = sum('分枝');
            return {
                plantCount: Math.max(0, Number(state.draftPlantCount) || 0),
                branchCount: state.draftPlants.filter(plant => plant.label === '分枝').length,
                mainPods: main,
                mainStemPlus: trunk + main,
                branchPods: branches,
                totalPods: trunk + main + branches,
            };
        }

        function renderSummary() {
            const summary = calculateDraftSummary();
            const metrics = [
                ['植株数量', summary.plantCount, '个'],
                ['分枝数量', summary.branchCount, '个'],
                ['主花序角果', summary.mainPods, '个'],
                ['主干 + 主枝', summary.mainStemPlus, '个'],
                ['分枝角果', summary.branchPods, '个'],
                ['角果总数', summary.totalPods, '个'],
            ];
            $('summaryBand').innerHTML = metrics.map(([label, value, unit]) => `
                <div class="metric">
                    <div class="metric-label">${label}</div>
                    <div class="metric-value">${escapeHtml(value)}<span class="metric-unit">${unit}</span></div>
                </div>`).join('');
        }

        function renderDraft() {
            renderSummary();
            const body = $('componentBody');
            if (!state.draftPlants.length) {
                body.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:28px">暂无部件</td></tr>';
                return;
            }
            body.innerHTML = state.draftPlants.map((plant, index) => `
                <tr data-index="${index}">
                    <td class="component-id">#${escapeHtml(plant.id ?? index + 1)}</td>
                    <td>
                        <select class="select component-label" aria-label="部件类型">
                            ${['主干', '主枝', '分枝'].map(label => `<option value="${label}"${plant.label === label ? ' selected' : ''}>${label}</option>`).join('')}
                        </select>
                    </td>
                    <td><input class="input count-input component-count" type="number" min="0" max="100000" step="1" value="${escapeHtml(Math.max(0, Number(plant.pod_count) || 0))}" aria-label="角果数量"></td>
                    <td class="original-count">${plant.pod_count_before_vlm == null ? '—' : escapeHtml(plant.pod_count_before_vlm)}</td>
                    <td>${plant.manual ? '<span class="manual-flag">人工新增</span>' : '模型识别'}</td>
                    <td><button class="icon-button danger remove-component" type="button" title="删除部件" aria-label="删除部件">×</button></td>
                </tr>`).join('');

            body.querySelectorAll('tr[data-index]').forEach(row => {
                const index = Number(row.dataset.index);
                row.querySelector('.component-label').addEventListener('change', event => {
                    state.draftPlants[index].label = event.target.value;
                    markDirty();
                    renderSummary();
                });
                row.querySelector('.component-count').addEventListener('input', event => {
                    state.draftPlants[index].pod_count = Math.max(0, Number(event.target.value) || 0);
                    markDirty();
                    renderSummary();
                });
                row.querySelector('.remove-component').addEventListener('click', () => {
                    state.draftPlants.splice(index, 1);
                    state.draftPlantCount = state.draftPlants.length;
                    $('plantCountInput').value = state.draftPlantCount;
                    markDirty();
                    renderDraft();
                });
            });
        }

        function markDirty() {
            state.dirty = true;
            updateSaveState();
        }

        function updateSaveState() {
            $('saveResultBtn').disabled = !state.dirty || !state.activeRunId;
            $('saveState').className = state.dirty ? 'dirty-state' : 'saved-state';
            $('saveState').textContent = state.dirty ? '有未保存修改' : '数据已保存';
            $('editorSubtitle').textContent = state.dirty ? '等待保存' : (state.activeRecord?.is_modified ? '已保存人工修订' : '原始识别结果');
        }

        function addComponent() {
            const numericIds = state.draftPlants.map(plant => Number(plant.id)).filter(Number.isFinite);
            const nextId = numericIds.length ? Math.max(...numericIds) + 1 : 1;
            state.draftPlants.push({
                id: nextId,
                label: $('newComponentType').value,
                pod_count: 0,
                manual: true,
                description: '用户新增',
            });
            state.draftPlantCount = state.draftPlants.length;
            $('plantCountInput').value = state.draftPlantCount;
            markDirty();
            renderDraft();
        }

        function addFilesToQueue(files) {
            const existing = new Set(state.queue.map(item => `${item.file.name}:${item.file.size}:${item.file.lastModified}`));
            let added = 0;
            for (const file of files) {
                const lower = file.name.toLowerCase();
                if (!IMAGE_EXTENSIONS.some(extension => lower.endsWith(extension))) continue;
                const key = `${file.name}:${file.size}:${file.lastModified}`;
                if (existing.has(key)) continue;
                existing.add(key);
                state.queue.push({
                    id: crypto.randomUUID(),
                    file,
                    path: file.webkitRelativePath || file.name,
                    status: 'pending',
                    error: '',
                    runId: null,
                });
                added += 1;
            }
            if (added) {
                renderQueue();
                toast(`已加入 ${added} 张图片`);
            }
        }

            const pending = state.queue.filter(item => item.status === 'pending').length;
            $('queueCount').textContent = pending;
            $('queueSubtitle').textContent = `${state.queue.length} 张图片 · ${pending} 张待处理`;
            $('queuePanel').classList.toggle('hidden', state.queue.length === 0);
            $('startQueueBtn').disabled = state.queueRunning || pending === 0;

                const chipClass = item.status === 'completed' ? 'completed' : item.status === 'running' ? 'processing' : item.status === 'error' ? 'failed' : 'modified';
                return `<tr>
                    <td class="file-path" title="${escapeHtml(item.path)}">${escapeHtml(item.path)}</td>
                    <td>${escapeHtml(formatBytes(item.file.size))}</td>

        async function startQueue() {
            if (state.queueRunning) return;
            state.queueRunning = true;
            state.stopRequested = false;
            renderQueue();
            for (const item of state.queue) {
                if (state.stopRequested) break;
                if (item.status !== 'pending') continue;
                item.status = 'running';
                renderQueue();
                try {
                    const result = await analyzeFile(item.file);
                    item.status = 'completed';
                    item.runId = result?.run_id || null;
                } catch (error) {
                    item.status = 'error';
                    item.error = error.name === 'AbortError' ? '已停止' : error.message;
                    if (error.name !== 'AbortError') toast(`${item.file.name}：${error.message}`, 'error');
                }
                renderQueue();
                await loadHistory();
            }
            state.queueRunning = false;
            state.activeController = null;
            const folderItems = state.queue.filter(item => state.folderQueueIds.includes(item.id));
            state.folderRunIds = folderItems.filter(item => item.status === 'completed' && item.runId).map(item => item.runId);
            $('exportFolderSummaryBtn').classList.toggle('hidden', !folderItems.length || folderItems.some(item => item.status === 'pending' || item.status === 'running') || !state.folderRunIds.length);
            renderQueue();

        async function analyzeFile(file) {
            if (state.dirty && !confirm('当前修改尚未保存，确定开始新识别吗？')) {
                throw new DOMException('用户取消', 'AbortError');
            }
            const controller = new AbortController();
            state.activeController = controller;
            state.activeRunId = null;
            state.activeRecord = null;
            state.steps = [];
            state.dirty = false;
            showRecordShell(file.name, 'processing');
            $('recordMeta').innerHTML = `<span>${escapeHtml(formatBytes(file.size))}</span>`;
            $('stepsGrid').innerHTML = '';
            $('stepsSubtitle').textContent = '等待第一个步骤';

            const form = new FormData();
            form.append('file', file);
            const response = await api('/api/analyze', { method: 'POST', body: form, signal: controller.signal });
            const terminal = await consumeStream(response, controller.signal);
            if (terminal?.run_id) {
                await loadHistory();
                await openHistory(terminal.run_id);
            }
            return terminal;
        }

        async function analyzeOnline(path, name) {
            if (state.queueRunning) return;
            if (state.dirty && !confirm('当前修改尚未保存，确定开始新识别吗？')) return;
            const controller = new AbortController();
            state.activeController = controller;
            state.activeRunId = null;
            state.activeRecord = null;
            state.steps = [];
            state.dirty = false;
            showRecordShell(name || path, 'processing');
            $('recordMeta').innerHTML = `<span>${escapeHtml(path)}</span>`;
            $('stepsGrid').innerHTML = '';
            $('stepsSubtitle').textContent = '等待第一个步骤';
            $('libraryDialog').close();
            const response = await api('/api/analyze_online', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ path, method: 'stalk' }),
                signal: controller.signal,
            });
            const terminal = await consumeStream(response, controller.signal);
            await loadHistory();
            if (terminal?.run_id) await openHistory(terminal.run_id);
        }

        async function consumeStream(response, signal) {
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            let terminal = null;
            while (true) {
                if (signal.aborted) throw new DOMException('已停止', 'AbortError');
                const { done, value } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop() || '';
                for (const line of lines) {
                    if (!line.startsWith('data: ')) continue;
                    let event;
                    try { event = JSON.parse(line.slice(6)); } catch (_) { continue; }
                    if (event.type === 'step') {
                        appendLiveStep(event);
                    } else if (event.type === 'result') {
                        terminal = event;
                    } else if (event.type === 'error') {
                        throw new Error(event.message || '识别失败');
                    }
                }
            }
            if (!terminal) throw new Error('识别结束但没有返回结果');
            return terminal;
        }

        function appendAssistantMessage(text, kind = 'assistant', response = null) {
            const message = document.createElement('div');
            message.className = `assistant-message ${kind === 'user' ? 'user' : ''}`;
            const body = document.createElement('div');
            body.textContent = text;
            message.appendChild(body);
            if (response?.citations?.length) {
                const evidence = document.createElement('div');
                evidence.className = 'assistant-evidence';
                response.citations.forEach(citation => {
                    const item = document.createElement('div');
                    item.textContent = citation;
                    evidence.appendChild(item);
                });
                message.appendChild(evidence);
            }
            if (response?.job_id || response?.trace_id) {
                const meta = document.createElement('div');
                meta.className = 'assistant-meta';
                meta.textContent = [response.job_id && `任务 ${response.job_id}`, response.trace_id && `追踪 ${response.trace_id}`].filter(Boolean).join(' · ');
                message.appendChild(meta);
            }
            if (response?.data && response.status === 'data_summarized') {
                const summary = document.createElement('div');
                summary.className = 'assistant-evidence';
                const fields = [
                    ['样本数', response.data.sample_count],
                    ['已完成', response.data.completed_count],
                    ['失败', response.data.failed_count],
                    ['平均角果数', response.data.average_total_pods],
                ];
                fields.filter(([, value]) => value !== undefined && value !== null).forEach(([label, value]) => {
                    const item = document.createElement('div');
                    item.textContent = `${label}：${value}`;
                    summary.appendChild(item);
                });
                if (summary.childElementCount) message.appendChild(summary);
            }
            $('assistantMessages').appendChild(message);
            message.scrollIntoView({ block: 'nearest' });
        }

                for (const file of files) assets.push(await uploadAssistantAsset(file));
                const asset_ids = assets.map(asset => asset.asset_id);

                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ asset_ids, project_id }),

                const response = await api('/api/v2/batches', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ asset_ids, project_id, confirm: true }),
                });

                appendAssistantMessage(`批量任务已创建：${batch.batch_id}，共 ${batch.job_ids.length} 个子任务。`, 'assistant');

            try {
                const response = await api(`/api/v2/batches/${encodeURIComponent(batchId)}/cancel`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ confirm: true, project_id: $('assistantProjectId').value.trim() || 'default' }) });

        async function loadTaskResult(jobId) {
            const panel = $('taskResultPanel');

            try {
                const projectId = encodeURIComponent($('assistantProjectId').value.trim() || 'default');

                    ['运行 ID', result.run_id || '-'],
                    ['总角果数', result.total_pods ?? result.total_pod_count ?? '-'],
                    ['主枝角果数', result.main_inflorescence_pod_count ?? '-'],
                    ['分枝角果数', result.branch_pod_count ?? '-'],
                ];
                const provenance = result.provenance;
                const provenanceLine = provenance
                    ? `<br>算法版本：${escapeHtml(provenance.algorithm || '-')} ${escapeHtml(provenance.algorithm_version || '')}<br>视觉模型：${escapeHtml(provenance.vlm_model || '-')}<br>执行模式：${escapeHtml(provenance.executor_mode || '-')}`

                    : '<br>复核反馈：暂无';
                const revisionChanges = payload.revision_diff?.changes || {};
                const diffLine = payload.revision_diff?.changed
                    ? `<br>人工修订差异：${escapeHtml(Object.entries(revisionChanges).map(([field, value]) => `${field} ${value.automatic}→${value.current}`).join('；'))}`
                    : '';
                panel.innerHTML = `<strong>算法结果与证据</strong><br>${values.map(([label, value]) => `${escapeHtml(label)}：${escapeHtml(String(value))}`).join('<br>')}${provenanceLine}${feedbackLine}${diffLine}<br><button class="button compact" id="createTaskReviewBtn" type="button">创建人工复核</button> <button class="button compact" id="createTaskReportBtn" type="button">生成报告</button>${result.run_id ? ` <button class="button compact" id="openTaskHistoryBtn" type="button">打开完整结果</button>` : ''}`;
                $('createTaskReviewBtn').addEventListener('click', () => createTaskReview(jobId));
                $('createTaskReportBtn').addEventListener('click', () => createTaskReport(jobId));
                const openHistoryButton = $('openTaskHistoryBtn');
                if (openHistoryButton) {

                        $('taskCenterDialog').close();
                        await openHistory(result.run_id);

                panel.textContent = `结果读取失败：${error.message}`;
            }

        async function openReviewRevision(review) {
            const resolution = prompt('请输入人工复核结论：');
            if (!resolution || !resolution.trim()) return;
            if (!confirm('确认打开原始结果进行人工修订？保存修改后会同时结案，系统不会自动改写计数。')) return;
            try {
                const projectId = encodeURIComponent($('assistantProjectId').value.trim() || 'default');
                const response = await api(`/api/v2/jobs/${encodeURIComponent(review.job_id)}?project_id=${projectId}`);
                const job = await response.json();
                if (job.status !== 'completed' || !job.run_id) throw new Error('关联任务未完成或缺少可修订结果');
                state.pendingReview = { reviewId: review.review_id, runId: job.run_id, resolution: resolution.trim() };
                $('taskCenterDialog').close();
                await openHistory(job.run_id);
                toast('请人工核对并修改结果，点击“保存修改”后将结案。');
            } catch (error) {
                state.pendingReview = null;
                toast(`打开复核修订失败：${error.message}`, 'error');
            }
        }

                const percent = value => value == null ? 'unknown' : `${(Number(value) * 100).toFixed(1)}%`;
                const reconciliation = metrics.event_reconciliation || {};
                panel.innerHTML = `<strong>运营指标（${escapeHtml(metrics.project_id || 'default')} 项目）</strong><br>缓存命中率：${escapeHtml(percent(metrics.cache.hit_rate))}（请求 ${escapeHtml(String(metrics.cache.request_count))}）<br>复核率：${escapeHtml(percent(metrics.analysis.review_rate))}<br>模型调用：${escapeHtml(String(metrics.model_calls.count))} 次，估算成本：${escapeHtml(String(metrics.model_calls.estimated_cost))}<br>MCP 越权率：${escapeHtml(percent(metrics.mcp.forbidden_rate))}<br>未确认写操作率：${escapeHtml(percent(metrics.write_operations.unconfirmed_execution_rate))}<br>事件投影对账：${reconciliation.in_sync ? '一致' : '存在差异'}（差异类型 ${escapeHtml(String(reconciliation.mismatched_event_type_count ?? 0))}）<br><span class="assistant-meta">运营指标用于审计与成本治理，不代表图像计数准确率。</span>`;
            } catch (error) {
                panel.textContent = `运营指标读取失败：${error.message}`;
            }
        }

        async function loadAgentQualityReport() {
            const panel = $('taskResultPanel');
            panel.classList.remove('hidden');
            panel.textContent = '正在运行离线 Agent 质量评测...';
            try {
                const response = await api('/api/v2/quality/agent-evaluation');
                const report = await response.json();
                const percent = value => `${(Number(value) * 100).toFixed(1)}%`;
                panel.innerHTML = `<strong>Agent 离线质量评测</strong><br>范围：${escapeHtml(report.scope)}<br>样本数：${escapeHtml(String(report.sample_count))}<br>路由准确率：${escapeHtml(percent(report.routing_accuracy))}<br>工具选择准确率：${escapeHtml(percent(report.tool_selection_accuracy))}<br>引用覆盖率：${escapeHtml(percent(report.citation_coverage))}（需引用用例 ${escapeHtml(String(report.citation_required_case_count))} 条）<br>全部用例通过：${report.passed ? '是' : '否'}<br><span class="assistant-meta">这些是离线黄金用例指标，不代表图像计数整体准确率。</span>`;
            } catch (error) {
                panel.textContent = `质量评测读取失败：${error.message}`;
            }
        }

        async function createTaskReview(jobId) {
            const reason = prompt('请输入复核原因（不会修改原始分析结果）：');
            if (!reason || !reason.trim()) return;
            if (!confirm('确认创建人工复核任务吗？')) return;
            try {
                const response = await api('/api/v2/reviews', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ job_id: jobId, reason: reason.trim(), confirm: true, project_id: $('assistantProjectId').value.trim() || 'default' }),
                });
                const review = await response.json();
                toast(`已创建复核任务：${review.review_id}`);
            } catch (error) {
                toast(`创建复核失败：${error.message}`, 'error');
            }
        }

        async function createTaskReport(jobId) {
            const question = prompt('请输入报告关注点（可留空）：') || '';
            if (!confirm('确认基于当前已完成算法结果生成报告吗？')) return;
            const panel = $('taskResultPanel');
            panel.textContent = '正在生成报告...';
            try {
                const response = await api(`/api/v2/agent/jobs/${encodeURIComponent(jobId)}/report`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question, confirm: true }),
                });
                const result = await response.json();
                if (result.status === 'queued' || result.status === 'running') {
                    panel.textContent = '报告任务已提交，正在生成...';
                    const timer = setInterval(async () => {
                        const projectId = encodeURIComponent($('assistantProjectId').value.trim() || 'default');
                        const reportResponse = await api(`/api/v2/agent/reports/${encodeURIComponent(result.report_job_id)}?project_id=${projectId}`);
                        const reportJob = await reportResponse.json();
                        if (reportJob.status === 'completed') { clearInterval(timer); panel.innerHTML = `<strong>分析报告</strong><br>${escapeHtml(reportJob.report).replaceAll('\n', '<br>')}`; }
                        if (reportJob.status === 'failed') { clearInterval(timer); panel.textContent = `报告生成失败：${reportJob.error_message}`; }
                    }, 1000);
                    return;
                }
                const provenance = result.provenance;
                const sourceLine = provenance
                    ? `<div class="assistant-meta">来源版本：${escapeHtml(provenance.algorithm || '-')} ${escapeHtml(provenance.algorithm_version || '')}；模型：${escapeHtml(provenance.vlm_model || '-')}</div>`
                    : '<div class="assistant-meta">来源版本：旧结果未记录 provenance</div>';
                panel.innerHTML = `<strong>分析报告</strong>${sourceLine}<br>${escapeHtml(result.report).replaceAll('\n', '<br>')}<br><button class="button compact" id="downloadTaskReportBtn" type="button">下载报告</button>`;
                $('downloadTaskReportBtn').addEventListener('click', () => downloadTaskReport(result.report, jobId, provenance));
            } catch (error) {
                panel.textContent = `报告生成失败：${error.message}`;
            }
        }

        function downloadTaskReport(report, jobId, provenance = null) {
            const source = provenance
                ? `来源版本：${provenance.algorithm || '-'} ${provenance.algorithm_version || ''}\n视觉模型：${provenance.vlm_model || '-'}\n执行模式：${provenance.executor_mode || '-'}\n\n`
                : '';
            const blob = new Blob([source + report], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `phenotype-report-${jobId}.txt`;
            link.click();
            URL.revokeObjectURL(url);
        }

        function debounce(fn, delay = 250) {
            let timer;
            return (...args) => {
                clearTimeout(timer);
                timer = setTimeout(() => fn(...args), delay);
            };
        }

        $('selectFileBtn').addEventListener('click', () => $('fileInput').click());
        $('exportFolderSummaryBtn').addEventListener('click', async () => {
            try {
                const response = await api('/api/history/folder-summary.xlsx', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ run_ids: state.folderRunIds, project_id: 'default' }),
                });
                const url = URL.createObjectURL(await response.blob());
                const link = document.createElement('a');
                link.href = url;
                link.download = 'folder-summary.xlsx';
                link.click();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            } catch (error) { toast(`导出失败：${error.message}`, 'error'); }
        });
        $('selectFolderBtn').addEventListener('click', () => $('folderInput').click());
        $('openLibraryBtn').addEventListener('click', openLibrary);
        $('fileInput').addEventListener('change', event => {
            addFilesToQueue([...event.target.files]);
            event.target.value = '';
            if (!state.queueRunning) startQueue();
        });
        $('folderInput').addEventListener('change', event => {
            state.folderRunIds = [];
            $('exportFolderSummaryBtn').classList.add('hidden');
            const existingIds = new Set(state.queue.map(item => item.id));
            addFilesToQueue([...event.target.files]);
            state.folderQueueIds = state.queue.filter(item => !existingIds.has(item.id)).map(item => item.id);
            event.target.value = '';
        });
        $('startQueueBtn').addEventListener('click', startQueue);
        $('stopQueueBtn').addEventListener('click', stopQueue);
        $('clearQueueBtn').addEventListener('click', () => { state.queue = []; renderQueue(); });
        $('refreshHistoryBtn').addEventListener('click', () => loadHistory());
        $('historySearch').addEventListener('input', debounce(() => loadHistory()));
        $('plantCountInput').addEventListener('input', event => {
            state.draftPlantCount = Math.max(0, Number(event.target.value) || 0);
            markDirty();
            renderSummary();
        });
        $('addComponentBtn').addEventListener('click', addComponent);
        $('saveResultBtn').addEventListener('click', saveResult);
        $('restoreResultBtn').addEventListener('click', restoreResult);
        $('toggleStepsBtn').addEventListener('click', () => { state.showAllSteps = !state.showAllSteps; renderSteps(); });
        $('closeLibraryBtn').addEventListener('click', () => $('libraryDialog').close());
        $('librarySearch').addEventListener('input', renderLibrary);
        $('closeLightboxBtn').addEventListener('click', () => $('lightboxDialog').close());
        $('openAssistantBtn').addEventListener('click', () => { $('assistantDialog').showModal(); $('assistantInput').focus(); });
        $('closeAssistantBtn').addEventListener('click', () => $('assistantDialog').close());
        $('assistantToolCallsBtn').addEventListener('click', loadAssistantToolCalls);
        $('assistantForm').addEventListener('submit', sendAssistantMessage);
        $('assistantProjectId').addEventListener('change', () => {
            state.assistantConversationId = null;
            appendAssistantMessage('已切换项目范围，后续消息将使用新的独立会话。', 'assistant');
        });
        $('assistantAnalyzeBtn').addEventListener('click', () => $('assistantFileInput').click());
        $('assistantBatchBtn').addEventListener('click', () => $('assistantBatchFileInput').click());
        $('assistantFileInput').addEventListener('change', event => {
            const [file] = event.target.files;
            event.target.value = '';
            if (file) analyzeAssistantFile(file);
        });
        $('assistantBatchFileInput').addEventListener('change', event => {
            const files = [...event.target.files];
            event.target.value = '';
            submitAssistantBatch(files);
        });
        $('openTaskCenterBtn').addEventListener('click', () => { $('taskCenterDialog').showModal(); loadTaskCenter(); startTaskCenterPolling(); });
        $('closeTaskCenterBtn').addEventListener('click', () => $('taskCenterDialog').close());
        $('refreshTaskCenterBtn').addEventListener('click', loadTaskCenter);
        $('openReviewQueueBtn').addEventListener('click', loadReviewQueue);
        $('openAuditBtn').addEventListener('click', loadAuditEvents);
        $('uploadKnowledgeBtn').addEventListener('click', () => $('knowledgeFileInput').click());
        $('searchKnowledgeBtn').addEventListener('click', searchKnowledge);
        $('runtimeStatusBtn').addEventListener('click', loadRuntimeStatus);
        $('operationsMetricsBtn').addEventListener('click', loadOperationsMetrics);
        $('domainEventsBtn').addEventListener('click', loadDomainEvents);
        $('domainSamplesBtn').addEventListener('click', loadDomainSamples);
        $('openBatchCenterBtn').addEventListener('click', loadBatchCenter);
        $('qualityReportBtn').addEventListener('click', loadAgentQualityReport);
        $('knowledgeFileInput').addEventListener('change', event => {
            const [file] = event.target.files;
            event.target.value = '';
            if (file) uploadKnowledgeFile(file);
        });
        $('lightboxDialog').addEventListener('click', event => { if (event.target === $('lightboxDialog')) $('lightboxDialog').close(); });
        $('libraryDialog').addEventListener('click', event => { if (event.target === $('libraryDialog')) $('libraryDialog').close(); });
        $('assistantDialog').addEventListener('click', event => { if (event.target === $('assistantDialog')) $('assistantDialog').close(); });
        $('assistantDialog').addEventListener('close', () => {
            [...state.jobEventSources.keys()].forEach(stopAssistantJobWatch);
        });
        $('taskCenterDialog').addEventListener('close', stopTaskCenterPolling);
        $('taskCenterDialog').addEventListener('click', event => { if (event.target === $('taskCenterDialog')) $('taskCenterDialog').close(); });

        window.addEventListener('beforeunload', event => {
            if (!state.dirty) return;
            event.preventDefault();
            event.returnValue = '';
        });

        renderQueue();
        checkHealth();
        loadHistory();
        setInterval(checkHealth, 30000);
    </script>
</body>
</html>
